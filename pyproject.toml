[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flomers-commerce-kg"
version = "0.2.0"
description = "Flomers B2B commerce contextual knowledge graph and matching engine prototype"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Flomers"}]
dependencies = [
  "radar-core @ git+https://github.com/ai-frendly-datahub/radar-core.git@v0.3.2",
  "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = ["unit: unit-scope tests"]

[tool.setuptools.packages.find]
where = [".", "src"]
include = ["commerceradar*", "flomers_kg*"]
